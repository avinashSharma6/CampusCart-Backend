spring.application.name=CampusCart

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/campuscart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:campuscart_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false

campuscart.upload-dir=${UPLOAD_DIR:${user.home}/.local/share/campuscart/uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.error.include-message=never
server.error.include-stacktrace=never
