<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | CampusCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav class="navbar navbar-dark cc-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">CampusCart</a>
        <div class="ms-auto">
            <a class="btn btn-outline-light btn-sm" th:href="@{/login}">
                Log in
            </a>
        </div>
    </div>
</nav>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="mb-4">
                <p class="text-secondary small text-uppercase fw-semibold mb-2">
                    CampusCart / Join the marketplace
                </p>
                <h1 class="h2 fw-bold mb-2">Create your account.</h1>
                <p class="text-secondary mb-0">
                    Buy and sell useful items within your campus community.
                </p>
            </div>

            <section class="card border shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/register}" th:object="${form}" method="post">
                        <div class="mb-4">
                            <label for="fullName" class="form-label fw-semibold">
                                Full name
                            </label>
                            <input id="fullName" type="text" class="form-control"
                                   th:field="*{fullName}" autocomplete="name"
                                   maxlength="100" required>
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('fullName')}"
                                 th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label fw-semibold">
                                University email
                            </label>
                            <input id="email" type="email" class="form-control"
                                   th:field="*{email}" autocomplete="email"
                                   placeholder="24EG101K01@anurag.edu.in"
                                   maxlength="100" required>
                            <div class="form-text">
                                Use your Anurag University student email.
                            </div>
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="phoneNumber" class="form-label fw-semibold">
                                Phone number
                                <span class="text-secondary fw-normal">(optional)</span>
                            </label>
                            <input id="phoneNumber" type="tel" class="form-control"
                                   th:field="*{phoneNumber}" autocomplete="tel"
                                   maxlength="20">
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('phoneNumber')}"
                                 th:errors="*{phoneNumber}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">
                                Password
                            </label>
                            <input id="password" type="password" class="form-control"
                                   th:field="*{password}" autocomplete="new-password"
                                   minlength="8" maxlength="72" required>
                            <div class="form-text">
                                Use at least 8 characters.
                            </div>
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-semibold">
                                Confirm password
                            </label>
                            <input id="confirmPassword" type="password"
                                   class="form-control"
                                   th:field="*{confirmPassword}"
                                   autocomplete="new-password"
                                   maxlength="72" required>
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}"></div>
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('passwordMatching')}"
                                 th:errors="*{passwordMatching}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">
                            Create account
                        </button>
                    </form>

                    <div class="border-top mt-4 pt-4">
                        <p class="text-center text-secondary mb-0">
                            Already have an account?
                            <a th:href="@{/login}" class="fw-semibold">Log in</a>
                        </p>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
