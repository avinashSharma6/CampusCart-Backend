<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="cc-footer">
    <div class="container d-flex flex-column flex-md-row
                justify-content-between align-items-md-center gap-3">

        <div>
            <div class="cc-footer-brand">CampusCart</div>
            <div class="small">
                Your campus, your marketplace.
            </div>
        </div>

        <nav class="d-flex flex-wrap gap-3 small"
             aria-label="Footer navigation">
            <a th:href="@{/about}">About</a>
            <a th:href="@{/marketplace-rules}">Marketplace rules</a>
        </nav>

        <div class="small">
            © <span th:text="${#dates.year(#dates.createNow())}">2026</span>
            CampusCart
        </div>
    </div>
</footer>
</body>
</html>
