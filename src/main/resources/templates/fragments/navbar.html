<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark cc-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="cc-brand-mark" aria-hidden="true">CC</span>
            <span class="fw-semibold">CampusCart</span>
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1 pt-3 pt-lg-0">
                <li class="nav-item">
                    <a class="nav-link px-lg-3" th:href="@{/listings}">
                        Marketplace
                    </a>
                </li>

                <li class="nav-item" th:if="${isAuthenticated}">
                    <a class="nav-link px-lg-3" th:href="@{/dashboard}">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item" th:if="${isAuthenticated}">
                    <a class="nav-link px-lg-3" th:href="@{/profile}">
                        Profile
                    </a>
                </li>

                <li class="nav-item" th:if="${isAdmin}">
                    <a class="nav-link px-lg-3" th:href="@{/admin}">
                        Admin
                    </a>
                </li>

                <li class="nav-item py-2 py-lg-0">
                    <form th:if="${isAuthenticated}"
                          th:action="@{/logout}"
                          method="post"
                          class="d-inline">
                        <button type="submit"
                                class="btn btn-outline-light btn-sm px-3">
                            Log out
                        </button>
                    </form>
                </li>

                <li class="nav-item" th:unless="${isAuthenticated}">
                    <a class="nav-link px-lg-3" th:href="@{/login}">
                        Log in
                    </a>
                </li>

                <li class="nav-item py-2 py-lg-0"
                    th:unless="${isAuthenticated}">
                    <a class="btn btn-warning btn-sm fw-semibold px-3"
                       th:href="@{/register}">
                        Join CampusCart
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
