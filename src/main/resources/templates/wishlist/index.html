<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Wishlist | CampusCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5 flex-grow-1">
    <div th:if="${successMessage}" class="alert alert-success" role="alert"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert"
         th:text="${errorMessage}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <p class="text-secondary mb-1">YOUR SAVED ITEMS</p>
            <h1 class="mb-2">My wishlist</h1>
            <p class="text-secondary mb-0">
                Keep track of things you might want to buy.
            </p>
        </div>
        <a th:href="@{/listings}" class="btn btn-outline-primary">
            Browse marketplace
        </a>
    </div>

    <div th:if="${#lists.isEmpty(wishlistItems)}" class="card cc-card">
        <div class="card-body text-center py-5 px-4">
            <h2 class="h5">Your wishlist is empty</h2>
            <p class="text-secondary">
                Save listings you're interested in and they'll appear here.
            </p>
            <a th:href="@{/listings}" class="btn btn-primary">
                Explore listings
            </a>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(wishlistItems)}" class="row g-4">
        <div class="col-sm-6 col-lg-4 col-xl-3"
             th:each="item : ${wishlistItems}">
            <article class="card cc-card h-100">
                <a th:if="${item.listing.status.name() == 'AVAILABLE'}"
                   th:href="@{/listings/{id}(id=${item.listing.id})}"
                   class="text-decoration-none">
                    <img th:src="${item.listing.imagePath != null and !item.listing.imagePath.isBlank()
                        ? item.listing.imagePath
                        : '/images/placeholder.svg'}"
                         class="card-img-top listing-card-image"
                         th:alt="${item.listing.title}"
                         loading="lazy">
                </a>

                <img th:unless="${item.listing.status.name() == 'AVAILABLE'}"
                     th:src="${item.listing.imagePath != null and !item.listing.imagePath.isBlank()
                        ? item.listing.imagePath
                        : '/images/placeholder.svg'}"
                     class="card-img-top listing-card-image"
                     th:alt="${item.listing.title}"
                     loading="lazy">

                <div class="card-body d-flex flex-column">
                    <p class="small text-secondary mb-2"
                       th:text="${item.listing.category.name}">Category</p>

                    <h2 class="h6" th:text="${item.listing.title}">
                        Listing title
                    </h2>

                    <p class="cc-price fs-5 mb-2"
                       th:text="${@priceFormatter.format(item.listing.price)}">
                        ₹0.00
                    </p>

                    <p class="small mb-3"
                       th:classappend="${item.listing.status.name() == 'AVAILABLE'}
                            ? ' text-success' : ' text-secondary'"
                       th:text="${#strings.replace(item.listing.status.name(), '_', ' ')}">
                        AVAILABLE
                    </p>

                    <div class="mt-auto d-flex flex-wrap gap-2">
                        <a th:if="${item.listing.status.name() == 'AVAILABLE'}"
                           th:href="@{/listings/{id}(id=${item.listing.id})}"
                           class="btn btn-outline-primary btn-sm">
                            View listing
                        </a>

                        <form th:action="@{/wishlist/{id}/remove(id=${item.listing.id})}"
                              method="post">
                            <button type="submit"
                                    class="btn btn-outline-danger btn-sm">
                                Remove
                            </button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
