
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Item Not Found | CampusCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5 flex-grow-1 d-flex align-items-center">
    <section class="w-100 text-center py-5">
        <p class="text-secondary small text-uppercase fw-semibold mb-3">
            CampusCart / Marketplace
        </p>
        <div class="display-1 fw-bold">404</div>
        <h1 class="h3 fw-bold mt-3 mb-2">We couldn't find that item</h1>
        <p class="text-secondary mx-auto mb-4" style="max-width: 460px;">
            This listing may have been removed, sold, or is no longer available.
            You can browse other items in the marketplace.
        </p>
        <div class="d-flex justify-content-center flex-wrap gap-2">
            <a th:href="@{/listings}" class="btn btn-primary px-4">
                Browse marketplace
            </a>
            <a th:href="@{/}" class="btn btn-outline-secondary px-4">
                Back to home
            </a>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
