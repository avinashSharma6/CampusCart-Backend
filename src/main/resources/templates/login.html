
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In | CampusCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav class="navbar navbar-dark cc-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">CampusCart</a>
        <div class="ms-auto">
            <a class="btn btn-outline-light btn-sm" th:href="@{/register}">
                Create account
            </a>
        </div>
    </div>
</nav>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center align-items-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="mb-4">
                <p class="text-secondary small text-uppercase fw-semibold mb-2">
                    CampusCart / Account
                </p>
                <h1 class="h2 fw-bold mb-2">Welcome back.</h1>
                <p class="text-secondary mb-0">
                    Log in to manage your listings and saved items.
                </p>
            </div>

            <section class="card border shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <div class="alert alert-success"
                         th:if="${registrationSuccess}"
                         th:text="${registrationSuccess}"
                         role="alert"></div>

                    <div class="alert alert-danger"
                         th:if="${loginError}"
                         th:text="${loginError}"
                         role="alert"></div>

                    <div class="alert alert-success"
                         th:if="${param.logout}"
                         role="alert">
                        You have been logged out successfully.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-4">
                            <label for="email" class="form-label fw-semibold">
                                University email
                            </label>
                            <input id="email" name="email" type="email"
                                   class="form-control"
                                   autocomplete="username"
                                   placeholder="24EG101K01@anurag.edu.in"
                                   maxlength="100" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">
                                Password
                            </label>
                            <input id="password" name="password" type="password"
                                   class="form-control"
                                   autocomplete="current-password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">
                            Log in
                        </button>
                    </form>

                    <div class="border-top mt-4 pt-4">
                        <p class="text-center text-secondary mb-0">
                            New to CampusCart?
                            <a th:href="@{/register}" class="fw-semibold">
                                Create an account
                            </a>
                        </p>
                    </div>
                </div>
            </section>

            <p class="small text-secondary text-center mt-4 mb-0">
                Use your Anurag University student email to sign in.
            </p>
        </div>
    </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
